version: 2
project_name: anef-tracker

before:
  hooks:
    - go mod tidy

builds:
  - id: anef
    binary: anef
    main: ./cmd/anef
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -X github.com/arihant-dev/anef-tracker/internal/version.Version={{.Version}} -X github.com/arihant-dev/anef-tracker/internal/version.Commit={{.Commit}} -X github.com/arihant-dev/anef-tracker/internal/version.BuildDate={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: arihant-dev
    name: anef-tracker
  mode: replace
  replace_existing_artifacts: true
  replace_existing_draft: true
  prerelease: auto

